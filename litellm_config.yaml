# LiteLLM Unified AI Gateway Configuration (Optional Proxy Mode)
# This file configures the LiteLLM Proxy service when deployed via Docker Compose.
# In embedded mode, the FastAPI backend uses the LiteLLM Python SDK directly.

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
  - model_name: claude-3-5-haiku
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
  - model_name: gemini-1.5-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
  - model_name: gemini-1.5-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
  - model_name: mistral-large
    litellm_params:
      model: mistral/mistral-large-latest

litellm_settings:
  drop_params: true
  telemetry: false
  request_timeout: 90
